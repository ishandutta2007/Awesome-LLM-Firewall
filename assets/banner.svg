<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a18cd1"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseRing {
        0% { r: 55px; opacity: 0.8; }
        50% { r: 85px; opacity: 0.2; }
        100% { r: 55px; opacity: 0.8; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(380px); opacity: 0.8; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes shieldPulse {
        0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.8)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6)); }
      }
      @keyframes orbitRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes textShimmer {
        0% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.8)); }
        100% { opacity: 0.9; }
      }
      .shield-anim {
        transform-origin: 200px 200px;
        animation: shieldPulse 4s ease-in-out infinite;
      }
      .pulse-circle {
        animation: pulseRing 3s ease-in-out infinite;
      }
      .scan-line {
        animation: scanBeam 6s ease-in-out infinite;
      }
      .orbit-group {
        transform-origin: 200px 200px;
        animation: orbitRotate 12s linear infinite;
      }
      .shimmer-text {
        animation: textShimmer 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>

    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <line class="scan-line" x1="0" y1="10" x2="1200" y2="10" stroke="url(#glowLine)" stroke-width="2"/>

  <g class="shield-anim">
    <circle class="pulse-circle" cx="200" cy="200" r="70" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
    
    <g class="orbit-group">
      <circle cx="200" cy="200" r="95" fill="none" stroke="#7000ff" stroke-width="1.5" stroke-dasharray="15 25" opacity="0.7"/>
      <circle cx="295" cy="200" r="5" fill="#00f0ff" filter="url(#subtleGlow)"/>
      <circle cx="105" cy="200" r="5" fill="#ff007f" filter="url(#subtleGlow)"/>
    </g>

    <path d="M 200,90 L 275,130 L 275,230 C 275,280 200,315 200,315 C 200,315 125,280 125,230 L 125,130 Z" 
          fill="#0c1022" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#neonGlow)"/>

    <path d="M 200,120 L 250,150 L 250,220 C 250,255 200,285 200,285 C 200,285 150,255 150,220 L 150,150 Z" 
          fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>

    <circle cx="200" cy="195" r="18" fill="#7000ff" stroke="#00f0ff" stroke-width="3" filter="url(#subtleGlow)"/>
    <path d="M 190,195 L 210,195 M 200,185 L 200,205" stroke="#ffffff" stroke-width="2.5"/>

    <line x1="200" y1="120" x2="200" y2="177" stroke="#00f0ff" stroke-width="2"/>
    <line x1="200" y1="213" x2="200" y2="285" stroke="#ff007f" stroke-width="2"/>
    <line x1="150" y1="185" x2="182" y2="195" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="250" y1="185" x2="218" y2="195" stroke="#00f0ff" stroke-width="1.5"/>
  </g>

  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#111c3a" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#00ff88" filter="url(#subtleGlow)"/>
    <text x="32" y="21" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PRODUCTION AI RUNTIME SECURITY</text>
  </g>

  <text class="shimmer-text" x="360" y="175" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="1.5">AWESOME LLM FIREWALL</text>

  <text x="360" y="220" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.8">
    Guardrails <tspan fill="#ff007f">•</tspan> Prompt Injection Defense <tspan fill="#ff007f">•</tspan> Policy Enforcement <tspan fill="#ff007f">•</tspan> Red Teaming
  </text>

  <g transform="translate(360, 260)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#151b2e" stroke="#2a385f" stroke-width="1.5"/>
      <text x="14" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600">🛡️ Input/Output Rails</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#151b2e" stroke="#2a385f" stroke-width="1.5"/>
      <text x="14" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600">⚡ Jailbreak Detection</text>
    </g>
    <g transform="translate(375, 0)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#151b2e" stroke="#2a385f" stroke-width="1.5"/>
      <text x="14" y="23" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600">🔒 DLP &amp; PII Guard</text>
    </g>
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#151b2e" stroke="#2a385f" stroke-width="1.5"/>
      <text x="14" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600">🌐 Top SaaS &amp; OSS</text>
    </g>
  </g>

  <line x1="360" y1="330" x2="1140" y2="330" stroke="url(#glowLine)" stroke-width="2"/>
</svg>